<!-- @dsCard group="Spacing" name="Depth & Elevation" subtitle="Depth from tint; one shadow, overlays only" viewport="700x220" -->
<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../styles.css"><style>body{padding:var(--loop-space-6)}.k{font-size:var(--loop-text-xs);color:var(--loop-ink-muted)}.n{font-size:var(--loop-text-sm);font-weight:var(--loop-weight-semibold)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--loop-space-4)}.c{height:140px;border-radius:var(--loop-radius-lg);padding:var(--loop-space-4);display:flex;flex-direction:column;justify-content:flex-end}</style></head><body><div class="g"><div class="c" style="box-shadow:inset 0 0 0 var(--loop-hairline) var(--loop-rule)"><span class="n">bg</span><span class="k">Page, insight cards (rule)</span></div><div class="c" style="background:var(--loop-surface)"><span class="n">surface</span><span class="k">Cases, sections, form</span></div><div class="c" style="background:var(--loop-bg);box-shadow:var(--loop-shadow-overlay)"><span class="n">overlay</span><span class="k">Menus, dialogs only</span></div></div></body></html>
