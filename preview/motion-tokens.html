<!-- @dsCard group="Motion" name="Motion Tokens" subtitle="Durations, easings, stagger · all collapse to 1ms under prefers-reduced-motion" viewport="700x360" -->
<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../styles.css"><style>body{padding:var(--loop-space-6)}.k{font-size:var(--loop-text-xs);color:var(--loop-ink-muted)}.n{font-size:var(--loop-text-sm);font-weight:var(--loop-weight-semibold)}.r{display:grid;grid-template-columns:140px 70px minmax(0,1fr) 150px;gap:var(--loop-space-4);align-items:center;padding:var(--loop-space-2) 0;border-bottom:var(--loop-hairline) solid var(--loop-rule)}.tr{position:relative;height:var(--loop-space-2);background:var(--loop-navy-50);border-radius:var(--loop-radius-xs)}.tr i{position:absolute;left:0;top:0;width:var(--loop-space-2);height:100%;border-radius:var(--loop-radius-xs);background:var(--loop-navy)}.go .tr i{left:calc(100% - var(--loop-space-2))}</style></head><body><div id="w"><div class="r"><span class="n">dur-instant</span><span class="k">80ms</span><div class="tr"><i style="transition:left var(--loop-dur-instant) var(--loop-ease)"></i></div><span class="k">Press feedback<br>ease</span></div><div class="r"><span class="n">dur-fast</span><span class="k">140ms</span><div class="tr"><i style="transition:left var(--loop-dur-fast) var(--loop-ease)"></i></div><span class="k">Hover, colour, border<br>ease</span></div><div class="r"><span class="n">dur-base</span><span class="k">240ms</span><div class="tr"><i style="transition:left var(--loop-dur-base) var(--loop-ease-out)"></i></div><span class="k">Menus, accordions, chevrons<br>ease-out</span></div><div class="r"><span class="n">dur-slow</span><span class="k">400ms</span><div class="tr"><i style="transition:left var(--loop-dur-slow) var(--loop-ease-out)"></i></div><span class="k">Section reveal, panel swap<br>ease-out</span></div><div class="r"><span class="n">dur-count</span><span class="k">1200ms</span><div class="tr"><i style="transition:left var(--loop-dur-count) var(--loop-ease-out)"></i></div><span class="k">Stat count-up (once)<br>ease-out</span></div><div class="r"><span class="n">stagger</span><span class="k">60ms</span><div class="tr"><i style="transition:left var(--loop-dur-base) var(--loop-ease)"></i></div><span class="k">Delay between list items<br>max 6 items</span></div></div><p class="k" style="margin-top:var(--loop-space-4)">Hover the card to replay.</p><script>const w=document.getElementById('w');let on=false;setInterval(()=>{on=!on;w.classList.toggle('go',on)},1800);</script></body></html>
