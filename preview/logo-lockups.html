<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../styles.css"><style>body{padding:var(--loop-space-6)}.k{font-size:var(--loop-text-xs);color:var(--loop-ink-muted)}.n{font-size:var(--loop-text-sm);font-weight:var(--loop-weight-semibold)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--loop-space-3)}.s{height:110px;border-radius:var(--loop-radius-lg);display:flex;align-items:center;justify-content:center;position:relative}.s img{max-width:52%;max-height:44%}.s .k{position:absolute;left:var(--loop-space-3);bottom:var(--loop-space-2)}</style></head><body><div class="g"><div class="s" style="box-shadow:inset 0 0 0 var(--loop-hairline) var(--loop-rule)"><img src="../assets/logo-loop-color.svg" alt="LOOP"><span class="k">Colour · white</span></div><div class="s" style="background:var(--loop-surface)"><img src="../assets/logo-loop-color.svg" alt="LOOP"><span class="k">Colour · navy 50</span></div><div class="s loop-on-navy"><img src="../assets/logo-loop-w.svg" alt="LOOP"><span class="k" style="color:var(--loop-on-navy-muted)">White · navy</span></div><div class="s" style="box-shadow:inset 0 0 0 var(--loop-hairline) var(--loop-rule)"><img src="../assets/logo-loop-b.svg" alt="LOOP"><span class="k">Black · mono</span></div><div class="s" style="background:var(--loop-ink)"><img src="../assets/logo-loop-w.svg" alt="LOOP"><span class="k" style="color:var(--loop-on-navy-muted)">White · ink</span></div></div></body></html>
