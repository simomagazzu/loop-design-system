<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../styles.css"><style>body{padding:var(--loop-space-6)}.k{font-size:var(--loop-text-xs);color:var(--loop-ink-muted)}.n{font-size:var(--loop-text-sm);font-weight:var(--loop-weight-semibold)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--loop-space-3)}.st{border-radius:var(--loop-radius-sm);padding:var(--loop-space-3) var(--loop-space-4);font-size:var(--loop-text-sm);font-weight:var(--loop-weight-semibold)}.r{display:grid;grid-template-columns:1fr 1fr;gap:var(--loop-space-3);margin-top:var(--loop-space-5)}.b{height:var(--loop-control-md);border-radius:var(--loop-radius-sm);display:flex;align-items:center;padding:0 var(--loop-space-4);font-size:var(--loop-text-sm)}.gr{margin-top:var(--loop-space-6)}.gr i{display:block;height:var(--loop-focus-width);background:var(--loop-logo-gradient);margin-bottom:var(--loop-space-2)}</style></head><body><div class="g"><div class="st" style="background:var(--loop-danger-50);color:var(--loop-danger)">Danger #B8352E</div><div class="st" style="background:var(--loop-warning-50);color:var(--loop-warning)">Warning #8F620A</div><div class="st" style="background:var(--loop-success-50);color:var(--loop-success)">Success #16794F</div></div><div class="r"><div class="b" style="border:var(--loop-hairline) solid var(--loop-rule)">Rule · 12% · dividers only</div><div class="b" style="border:var(--loop-hairline) solid var(--loop-rule-strong)">Rule-strong · 52% · controls (3.2:1)</div></div><div class="gr"><i></i><span class="k">--loop-logo-gradient · #1A2980 → #26D0CE · used once per site: 2px rule under the hero</span></div></body></html>
