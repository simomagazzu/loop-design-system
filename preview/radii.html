<!-- @dsCard group="Spacing" name="Radii & Nested Rule" subtitle="8 controls · 12 inner media · 18 cards · outer = inner + padding (18 = 12 + 6)" viewport="700x260" -->
<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../styles.css"><style>body{padding:var(--loop-space-6)}.k{font-size:var(--loop-text-xs);color:var(--loop-ink-muted)}.n{font-size:var(--loop-text-sm);font-weight:var(--loop-weight-semibold)}.g{display:grid;grid-template-columns:repeat(3,1fr) 1.4fr;gap:var(--loop-space-4);align-items:end}.b{height:110px;background:var(--loop-surface-2)}.nest{background:var(--loop-surface-2);border-radius:var(--loop-radius-lg);padding:var(--loop-frame-pad);height:150px}.nest div{height:100%;border-radius:var(--loop-radius-md);background:var(--loop-navy-50);display:flex;align-items:center;justify-content:center;font-size:var(--loop-text-xs);color:var(--loop-ink-muted);text-align:center;padding:var(--loop-space-2)}</style></head><body><div class="g"><div><div class="b" style="border-radius:var(--loop-radius-sm)"></div><div class="n">8px</div><div class="k">Buttons, inputs, chips</div></div><div><div class="b" style="border-radius:var(--loop-radius-md)"></div><div class="n">12px</div><div class="k">Media, menus</div></div><div><div class="b" style="border-radius:var(--loop-radius-lg)"></div><div class="n">18px</div><div class="k">Cards, frames</div></div><div><div class="nest"><div>inner 12 · pad 6 · outer 18</div></div><div class="n">Nested</div><div class="k">--loop-frame-pad</div></div></div></body></html>
