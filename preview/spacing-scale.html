v><div class="r"><span class="k">space-11</span><span class="k">96px</span><div class="b" style="width:calc(var(--loop-space-11) * 3)"></div></div><div class="r"><span class="k">space-12 · section</span><span class="k">128px</span><div class="b" style="width:calc(var(--loop-space-12) * 3)"></div></div></body></html>
